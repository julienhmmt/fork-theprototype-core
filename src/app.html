<!doctype html>
<!-- class="dark": the app is a dark-theme tool (tailwind darkMode:'class');
     every component's dark: styles were authored for this -->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.svg" />
		<!-- 36 U7: minimum-scale=1 — a phone browser otherwise ZOOMS OUT to fit anything wider than
		     the screen, and a foldable's posture change makes something briefly wider (the Connect
		     pill, before it re-docks): folded -> unfolded -> folded left a 380 px screen laid out at
		     479 px, the docked bar then filled those 479 px, and the zoom never came back. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
		<!-- 15-N: installable as a PWA. `standalone` drops the browser chrome,
		     which matters most on a phone where viewport height is the scarce
		     resource. iOS ignores the manifest for that, hence the apple-* trio. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#111827" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="theprototype" />
		<script>
			// apply the saved theme before first paint (themes.js takes over after)
			try {
				var savedTheme = localStorage.getItem('theme');
				if (savedTheme) {
					document.documentElement.dataset.theme = savedTheme;
					if (savedTheme === 'light') document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
			// 53 (A5): reduced motion, before first paint ($lib/motion.js takes over after)
			try {
				var motionPref = localStorage.getItem('ui:motion');
				var reduceMotion = motionPref === 'reduce' || (motionPref !== 'full' && !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches));
				document.documentElement.dataset.motion = reduceMotion ? 'reduce' : 'full';
			} catch (e) {}
			// 53 (A1): the saved UI scale, before first paint ($lib/uiScale.js takes over after)
			try {
				var savedScale = parseFloat(localStorage.getItem('ui:scale') || '');
				if (savedScale >= 90 && savedScale <= 150 && savedScale !== 100) document.documentElement.style.setProperty('--ui-scale', String(Math.round(savedScale / 10) / 10));
				if (savedScale >= 120 && savedScale <= 150) document.documentElement.dataset.uiLarge = '';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body class="overflow-x-hidden overflow-y-hidden bg-gray-900" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
